    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var origFetch = window.fetch ? window.fetch.bind(window) : undefined;
            var activeFetch = origFetch;
            var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (!winDesc || !winDesc.set) {
              try {
                Object.defineProperty(window, 'fetch', {
                  get: function() { return activeFetch; },
                  set: function(fn) { activeFetch = fn; },
                  configurable: true,
                  enumerable: true
                });
              } catch (_) {}
            }
          }
        } catch (_) {}
      })();
    </script>
